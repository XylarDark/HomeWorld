# CI: Win64 build (and optional test/package) for C++-touching changes.
# Requires a self-hosted Windows runner with UE 5.8 installed.
# Path filters (HR2-C): only runs when C++ / project descriptor paths change.
# Docs-only PRs stay on validate.yml — see docs/Setup/CI_POLICY.md.
name: CI

on:
  push:
    branches: [ master, main ]
    paths:
      - 'Source/**'
      - '**/*.Build.cs'
      - '*.uproject'
      - 'Plugins/**/Source/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'Source/**'
      - '**/*.Build.cs'
      - '*.uproject'
      - 'Plugins/**/Source/**'
      - '.github/workflows/ci.yml'

jobs:
  build-win64:
    runs-on: [self-hosted, windows, ue58]
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      (
        github.event_name != 'pull_request' ||
        (
          !contains(github.event.pull_request.body, 'Lead waiver: build-win64') &&
          !contains(toJSON(github.event.pull_request.labels.*.name), 'lead-waiver-build-win64')
        )
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build (Win64 Development)
        shell: pwsh
        run: |
          $env:UE_ENGINE = $env:UE_ENGINE ?? "C:\Program Files\Epic Games\UE_5.8"
          if (Test-Path ".\Tools\RunFullBuild.ps1") {
            .\Tools\RunFullBuild.ps1 -Platform Win64
          } else {
            .\Build-HomeWorld.bat
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run automation tests (optional)
        shell: pwsh
        env:
          UE_EDITOR: ${{ env.UE_EDITOR }}
        run: |
          if ($env:UE_EDITOR -and (Test-Path ".\Tools\RunTests.ps1")) {
            .\Tools\RunTests.ps1 -Group Smoke
          } else {
            Write-Host "Skipping tests (UE_EDITOR not set or RunTests.ps1 missing)"
          }

      - name: Archive build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: Build-HomeWorld.log

  build-win64-waiver-notice:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      (
        contains(github.event.pull_request.body, 'Lead waiver: build-win64') ||
        contains(toJSON(github.event.pull_request.labels.*.name), 'lead-waiver-build-win64')
      )
    steps:
      - name: Lead waiver acknowledged
        run: |
          echo "::notice::build-win64 skipped — Lead waiver documented on this PR."
          echo "Merge requires Lead approval per docs/Setup/CI_POLICY.md (HR2-C)."
