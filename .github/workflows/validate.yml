# Lightweight repo validation (no UE install required)
name: Validate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check HomeWorld.uproject exists and is valid JSON
        run: |
          if [ ! -f HomeWorld.uproject ]; then
            echo "::error::HomeWorld.uproject not found"
            exit 1
          fi
          python3 -c "import json; json.load(open('HomeWorld.uproject'))"
          echo "HomeWorld.uproject is valid JSON"

      - name: Validate config JSON files
        run: |
          for f in Content/Python/*.json; do
            if [ -f "$f" ]; then
              python3 -c "import json; json.load(open('$f'))" || {
                echo "::error::Invalid JSON: $f"
                exit 1
              }
              echo "  OK: $f"
            fi
          done

      - name: Check required docs exist and are non-empty (DOCS_LAYOUT canonical paths)
        run: |
          for doc in \
            AGENTS.md \
            docs/DOCS_LAYOUT.md \
            docs/SETUP.md \
            docs/CONVENTIONS.md \
            docs/KNOWN_ERRORS.md \
            docs/SESSION_LOG.md \
            docs/workflow/README.md \
            docs/TaskLists/README.md \
            docs/TaskLists/30_DAY_SCHEDULE.md \
            docs/TaskLists/DAILY_STATE.md \
            docs/Setup/CI_POLICY.md \
            docs/Setup/WINDOWS_BRIDGE.md; do
            if [ ! -s "$doc" ]; then
              echo "::error::Missing or empty: $doc"
              exit 1
            fi
            echo "  OK: $doc"
          done

      - name: Session door contract
        run: python3 Content/Python/check_session_start.py

      - name: Check quarantine pointer stubs still exist (compat only)
        run: |
          for stub in docs/workflow/30_DAY_SCHEDULE.md docs/workflow/MVP_AND_ROADMAP_STRATEGY.md; do
            if [ ! -s "$stub" ]; then
              echo "::warning::Quarantine stub missing (non-blocking): $stub"
            else
              echo "  OK (stub): $stub"
            fi
          done

      - name: C++ header/source pairing check
        run: |
          cd Source/HomeWorld
          ERRORS=0
          for h in *.h; do
            base="${h%.h}"
            if [ ! -f "${base}.cpp" ]; then
              echo "::warning::Header $h has no matching .cpp"
            fi
          done
          for cpp in *.cpp; do
            base="${cpp%.cpp}"
            if [ ! -f "${base}.h" ]; then
              echo "::warning::Source $cpp has no matching .h"
            fi
          done

      - name: UserHarness pin + submodule (HR2-B)
        run: bash scripts/verify-userharness-submodule.sh

      - name: Validate preflight-ue config JSON (HR3-B)
        run: python3 -c "import json; json.load(open('Config/preflight-ue.json'))"

      - name: UE preflight repo checks (HR3-B — cloud assets-only)
        run: npm run preflight:ue -- --skip-mcp --assets-only

      - name: UE preflight unit tests (HR3-B)
        run: npm run preflight:ue:test

      # The one command that proves the game is real. On CI the JS tier only: the
      # C++ build runs in the ci.yml workflow's own build step, and Safe-Build needs
      # a Windows host with the Editor toolchain. See Docs/35_HARNESS_REFACTOR_STRATEGY.md.
      - name: Verify (JS tier - see ci.yml for the C++ build)
        run: npm run verify:fast

      # These suites were previously only run locally. Tests that gate nothing are
      # not a harness: they catch a regression on whichever machine happens to run them
      # and nowhere else. This step is the first thing that makes them a gate.
      - name: Harness unit tests (tasklift, outcome, scope-reconcile, t0-evidence, preflight-ue, editor-lock)
        run: npm run test:all

      - name: Task-lift positive control (instrument can register success)
        run: npm run tasklift:control && npm run tasklift:control:taste

      - name: T0 scope reconciliation (declared scope vs the tree)
        run: npm run scope:reconcile:write
        continue-on-error: true

      # The boundary-change decision-log gate was REMOVED on 2026-10-01 (DEC-0034).
      # It was red for 14 commits and caught nothing: an enterprise compliance control
      # applied to a one-person team with no auditors, penalising exactly the batching a
      # solo developer already has to do. Docs/decisions/AGENT_DECISIONS.md stays as prose;
      # `npm run decisions` remains available to run by hand.

      - name: Git hygiene checks
        run: |
          ERRORS=0
          # No __pycache__ committed
          if find . -name "__pycache__" -not -path "./.git/*" | grep -q .; then
            echo "::error::__pycache__ directories found in repo"
            ERRORS=1
          fi
          # No temp JSON in project root
          for f in pie_*.json gamemode_check.json fix_*.json find_*.json delete_*.json; do
            if [ -f "$f" ]; then
              echo "::error::Temp file in project root: $f"
              ERRORS=1
            fi
          done
          # No .pyc files
          if find . -name "*.pyc" -not -path "./.git/*" | grep -q .; then
            echo "::error::.pyc files found in repo"
            ERRORS=1
          fi
          if [ $ERRORS -ne 0 ]; then exit 1; fi
          echo "Git hygiene OK"

  # Structural rule score — NON-BLOCKING by Lead decision (2026-10-01).
  #
  # It cannot be a merge gate: `skillevaluator` is not published on PyPI (it is a
  # git-installed uv tool), so a hosted runner has no way to obtain the exact
  # version this corpus was measured with. Scoring against an arbitrary version
  # would produce numbers that look comparable and are not.
  #
  # So this step is honest about its own reach: it RUNS the gate when a scorer is
  # present, and when one is not it says so out loud rather than reporting a pass.
  # `continue-on-error` is belt-and-braces, not the mechanism.
  rules-score:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Locate the scorer
        id: scorer
        run: |
          if command -v skillevaluator >/dev/null 2>&1; then
            echo "found=$(command -v skillevaluator)" >> "$GITHUB_OUTPUT"
            echo "version=$(skillevaluator --version 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"
          else
            echo "found=" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Structural rule score (non-blocking)
        run: |
          if [ -z "${{ steps.scorer.outputs.found }}" ]; then
            echo "::notice title=Structural rule score not run::skillevaluator is not published on PyPI and is a git-installed uv tool, so this runner cannot obtain the version the corpus was measured with (required: 0.4.0). Run 'npm run rules:score -- --strict' locally. This is a skipped gate, not a passing one."
            exit 0
          fi
          echo "scorer version: ${{ steps.scorer.outputs.version }} (required: 0.4.0)"
          if [ "${{ steps.scorer.outputs.version }}" != "0.4.0" ]; then
            echo "::warning title=Scorer version drift::${{ steps.scorer.outputs.version }} is not 0.4.0. Scores from a different rubric version are a different measurement and are not comparable with docs/measured/SKILL_LIFT_BASELINE.md"
          fi
          npm run rules:score -- --strict

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python scripts
        run: |
          ruff check Content/Python/ \
            --select E,F,W \
            --ignore E501,F401,E722 \
            --exclude "__pycache__" \
            || true
          echo "Python lint complete (warnings only, non-blocking)"
